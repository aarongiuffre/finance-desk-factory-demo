# Finance desk log rotation — USER-level, no sudo.
# Driven by ~/.config/systemd/user/finance-logrotate.timer (daily).
# State file lives under logs/ (repo data dir, survives reboots).
#
# Rules of the road (Grok batch-2 item 3):
#  - copytruncate EVERYWHERE: eda-pull.service holds nasdaq_filing_pull3.log
#    open via StandardOutput=append: — move-and-recreate would keep writing
#    into the renamed inode. Never restart eda-pull for rotation.
#  - logs/confluence-history.jsonl is NOT here: it's a ledger read by
#    backtest.py / event_study.py / screen_log.py / verdict_*.py — never
#    rotate or truncate it. Size control (if ever) = compress old years into
#    a sidecar; proposal only, not implemented.
#  - crawl_*.log stopped growing when finance-crawl retired (2026-10-08);
#    they're static history — left alone (compressing them saves ~3M, not
#    worth touching).
#  - refresh-*.log older than 14 days are gzipped IN PLACE (logs/refresh-*.log.gz)
#    by an ExecStartPost find+gzip step in finance-logrotate.service — logrotate
#    has no age-based compress for one-shot files. Nothing reads them plain;
#    use zcat/zgrep. The size-based stanza below still applies to big live ones.
#
# Run manually:  logrotate -d -s logs/.logrotate.state ops/logrotate.conf  (dry)
#                logrotate -s logs/.logrotate.state ops/logrotate.conf      (live)

/data/finance/logs/nasdaq_filing_pull3.log {
    # size+maxsize dominate over daily: this file grows ~13MB/day while the
    # crawl runs, so we rotate on SIZE (25M cap, hard ceiling 50M), not time.
    rotate 14
    size 25M
    maxsize 50M
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%s
    olddir /data/finance/logs/rotated
    createolddir 0750 slowglow slowglow
}

/data/finance/logs/refresh-*.log /data/finance/logs/facts-cron.log {
    # timestamped one-shot files: only compress the big ones past 20M, keep 30
    rotate 30
    size 20M
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%s
    olddir /data/finance/logs/rotated
    createolddir 0750 slowglow slowglow
}
