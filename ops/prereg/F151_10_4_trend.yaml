# PRE-REGISTRATION - F151_10_4_trend (Soper 151 Ch10 batch, F151_ prefix).
# Written 2026-10-28 BEFORE any tune run.  New F151_ family; re-opens nothing.
# Book section 10.4: Trend following / momentum (Eqs 474-477).
hypothesis: F151_10_4_trend
family: F151_10_4_trend
kind: hypothesis
literature: >-
  Kakushadze & Serur 10.4: weights wi = gamma * eta_i / sigma_i (Eq 474)
  with eta_i = sign(R_i) (Eq 475), R_i the futures return over the past
  period T (days, weeks, or months), sigma_i the historical volatility,
  gamma set by sum |wi| = 1 (Eq 476).  NOT dollar-neutral (long/short bias
  by construction).  The book flags the sign-flip instability for small
  |R_i| and offers two rectifications: smoothing eta_i = tanh(R_i / kappa)
  with kappa e.g. the cross-sectional std of R_i, and demeaning the weights
  (Eq 477) to restore dollar-neutrality.  Related literature: Moskowitz,
  Ooi & Pedersen 2012 (time-series momentum), Balta & Kosowski 2013.
prior: >-
  MODERATE PRIOR FOR the mechanism (time-series momentum on liquid futures
  is one of the best-documented premia), BUT two preregistered adversarial
  concerns: (i) 2015-2017 is a chop-to-bull transition - 2015 chop kills
  trend, 2016-17 pays it, so G2 year-concentration is the likely death;
  (ii) the Yahoo continuous tape's unpublished roll convention adds
  non-tradeable roll-day returns to R_i (documented wall).  Standard
  desk gates apply unchanged - this is an alpha family.
signal: >-
  Panel = the same 30 full-coverage Yahoo futures as F151_10_3.  At the
  last trading day D of week W (active from the next bar, held one week):
  eligibility_i = >= 90% of the trailing window as RAW bars; R_i = return
  over the trailing T business days ending D; sigma_i = std of DAILY
  returns over the trailing T business days ending D (book: "computed over
  the period T or some other period" - T it is).  Requires >= 12 eligible
  names, else flat.  wi = gamma * eta_i / sigma_i normalized to
  sum |wi| = 1 with eta_i per cell; tanh cell uses
  eta_i = tanh(R_i / kappa), kappa = cross-sectional std of R_i at D;
  dn cell demeans eta_i/sigma_i by its cross-sectional mean before
  normalization (Eq 477).  Weekly rebalance.
cells:
  trend_5d: "Eq 474 verbatim, T = 5 days, sign eta"
  trend_21d: "Eq 474 verbatim, T = 21 days, sign eta"
  trend_63d: "Eq 474 verbatim, T = 63 days, sign eta"
  trend_21d_dn: "Eq 477 dollar-neutral rectification, T = 21 days"
  trend_21d_tanh: "tanh-smoothed eta, T = 21 days, kappa = x-sec std of Ri"
total_cells: 5 (whole preregistered budget; no post-hoc cells)
g4_floor: ">= 78 funded weekly rebalance episodes (~75% of 3y weeks)"

fold: dev
window:
  data_start: "2012-01-01 (warmup: 63d windows)"
  data_end: "2017-12-31 tune cap (disk pull cap AND loader cap both 2017-12-31)"
  split_rule: >-
    tune = 2015-01-01..2017-12-31.  Dev holdout 2018-2019 NEVER READ this
    run.  Loader hard-caps every series at 2017-12-31.
data:
  futures: "30-ticker panel, raw/futures/<T>.json (futures_pull.py, Yahoo chart v8, 2012-01-01..2017-12-31): ES NQ YM CL NG RB HO GC SI HG PL PA ZC ZW ZS ZL KC SB CT CC ZN ZB ZF ZT 6E 6J 6B 6A 6C 6S (all '=F')"
proxy_walls: &walls >-
  (1) Yahoo "=F" continuous series: blend/roll method unpublished, not the
  CME settlement tape (CME/ICE paid) - the free substitute; scored R_i
  embed Yahoo's roll-day returns, which are NOT tradeable (documented);
  (2) volume is contracts, dollar ADV not computable - flat cost
  convention below; (3) no live execution.
costs: &costs >-
  Futures-only panel: flat 5 bp/side on both legs (engine large-bucket side
  cost 30 bp scaled by 1/6 via cost_mult = 1/6 - documented proxy: real
  liquid-futures round trips ~1-4 bp; 5 bp/side conservative), no borrow
  (futures shorts self-financing, Ch8 convention).
gates: &gates >-
  Six preregistered gates, ALL must hold for a cell to pass on the tune
  slice - STANDARD desk gates, no adaptation (alpha family): G1 lookahead
  (4 row-slice cuts + loader cut + decision-early mutant must differ);
  G2 concentration (max year share of net pnl <= 0.40 AND max episode
  share of gross <= 0.25); G3 regime (>= 2 of 3 thirds net-positive);
  G4 min trades (floor above); G5 fees (net Sharpe >= 0.8 AND net CAGR
  > 0); G6 stress (net CAGR > 0 at 2x costs).
verdict_policy:
  - "0 gate-surviving cells -> KILL at tune: KILL.md, no go ask."
  - ">= 1 survivor -> KEEP_TUNE: holdout unread; BLOCKED awaiting standing
     dev go before any scored DEV run."
reporting:
  - "headline per cell: net Sharpe, net CAGR, max DD, episodes, turnover/yr, cost drag/yr, avg gross, net long bias (mean sum wi)"
  - "report-only: per-year net pnl; eta flip counts per rebalance (the book's instability flag); names held at last 6 rebalances"
  - "benchmarks reported ungated: equal-weight futures basket; per-name T=21d sign-trend Sharpe"
  - "honest caveats: whole window POST-publication; continuous-tape roll returns pollute R_i (documented wall); sign eta on 5d R_i flips often - the book's own instability concern, measured not assumed"
