literature: >-
  Kakushadze & Serur 16.6: purchase a distressed property at a substantial
  discount below market, renovate, resell at a price covering renovation costs
  plus profit.  A short-term PRIVATE real estate investment strategy - the
  return is purchase discount minus renovation cost minus carrying cost, timed
  at the property-transaction level.
blocked_at_prereg: true
blocked_reason: >-
  The mechanism requires a per-transaction property tape that no free source
  provides:
  * Purchase prices at a discount + post-renovation resale prices = MLS closed
    transactions (subscription/Realtor-fed; MLS access is licensed) or ATTOM/
    CoreLogic/CountyRecorder deed tapes (paid).  Zillow/Realtor.com/trulia-style
    consumer sites are bot-walled on this desk (standing wall) and would not give
    clean transaction tapes anyway.
  * The DISTRESS screen (which properties are distressed and the discount size)
    is a paid dataset (auction/foreclosure feeds, ATTOM foreclosure DB).
  * Renovation costs and holding/carrying costs (title, insurance, financing,
    taxes) are deal-level private costs - no free tape.
  * Listed proxies do NOT transfer the mechanism: homebuilder or REIT equities
    carry no per-property purchase discount, renovation outlay, or resale spread;
    Case-Shiller HPIs are index levels, not transaction margins.  iBuyer-era
    data (post-2017) is out of the tune window and still paid/proprietary.
data_needed: >-
  Per-transaction deed/recording tape with purchase price, resale price, dates
