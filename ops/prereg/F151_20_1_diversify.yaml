# PRE-REGISTRATION - F151_20_1_diversify (Soper FULL-151 Ch20 batch, F151_ prefix).
# Written 2026-10-28 BEFORE any tune run.  New F151_ family: does not re-open any
# retired name (H1-H3, PRIMARY H4-H9, W2a-W2d, Eq_*, F151_3_*..F151_19_* all
# closed 2026-10-28).  Book 20 Infrastructure - theme 1: use infrastructure
# assets to improve the risk-adjusted return of diversified portfolios.
# The book has NO backtests and NO equations for Chapter 20 - no performance
# claims are attributed to it anywhere below.  Paper / free public only; no spend.
hypothesis: F151_20_1_diversify
family: F151_20_1_diversify
kind: hypothesis
literature: >-
  Kakushadze & Serur ch.20 (prose only, no numbered 20.x strategies): one
  investment strategy is to use infrastructure assets to improve risk-adjusted
  returns of well-diversified portfolios, e.g. via tracking ETFs, global
  infrastructure funds, unlisted infrastructure funds.  The book frames NO
  rule: no sizing, no rebalance frequency, no eligibility definition.  The only
  tradeable listed form is a buy-and-hold infrastructure ETF sleeve inside a
  traditional equity/bond mix - the same always-on premise-cell class as
  F151_16_2_mixed_asset_re (real estate sleeves), adjudicated by a
  preregistered sleeve-vs-baseline comparison rule, not by gate survival alone.
prior: >-
  WEAK-PRIOR, two-sided.  (a) The diversification premise (low correlation of
  listed infrastructure vs SPY/AGG, stable in stress) is measurable report-only.
  (b) A fixed infra sleeve is an always-on allocation: it cannot pass G2's
  episode-share test BY CONSTRUCTION (single episode; same class as 16_2 and
  the Ch13/Ch14 static premise cells), so the family decision keys on the
  preregistered comparison rule below.  (c) 2015-2017 was a strong equity tape
  (SPY calendar +1.4%/+11%/+21.8%); listed infrastructure carried utility-like
  beta and paid a lower equity run - the sleeve plausibly DILUTES the mix
  (16_2's REIT sleeves all diluted Sharpe 0.91-1.00 vs base 1.06).  (d) Global
  infrastructure ETFs are dominated by utilities + energy + transport - closer
  to AGG's low vol than SPY's; risk reduction is the more plausible channel
  than return addition.
signal: >-
  No timing signal - fixed-weight mixes rebalanced to target on the LAST SPY
  session of each calendar month (decision at that close, weights active the
  next session).  All legs total-return adjclose.  This is the book's
  buy-and-hold rule in its tradeable-ETF form.
cells:
  mix_6040_base: "60% SPY / 40% AGG, monthly rebalance - the no-infra benchmark cell"
  infra10_igf: "54% SPY / 36% AGG / 10% IGF (iShares Global Infrastructure,
    tape 2007-12+), monthly rebalance"
  infra10_gii: "54% SPY / 36% AGG / 10% GII (SPDR S&P Global Infrastructure,
    tape 2007-01+), monthly rebalance"
  infra10_tolz: "54% SPY / 36% AGG / 10% TOLZ (ProShares DJ Brookfield Global
    Infrastructure, tape 2014-03+), monthly rebalance"
  infra10_nfra: "54% SPY / 36% AGG / 10% NFRA (Northern Trust STOXX Global
    Broad Infrastructure, tape 2013-10+), monthly rebalance"
  infra20_igf: "48% SPY / 32% AGG / 20% IGF, monthly rebalance - 2x sizing on
    the broadest global leg, tests whether any risk-reduction channel scales"
total_cells: 6 (whole preregistered budget; no post-hoc cells)
g4_floor: ">= 24 position-change days for every cell (monthly rebalances of a
  2-3 asset mix exceed this only via drift; preregistered floor 24)"

fold: dev
window:
  data_start: "2015-01-01 (dev fold; warmup reads pre-2015 bars only as trailing history)"
  data_end: "2017-12-31 tune cap (ETF loaders cap bars at the cap)"
  split_rule: >-
    tune = 2015-01-01..2017-12-31 (36 months).  Dev holdout 2018-01-01..2019-12-31
    NEVER READ this run (no validation or holdout without go).  Loaders cap
    bars at 2017-12-31; the four infra tapes were pulled --backfill max
    2026-10-28.
data:
  prices: >-
    raw/price/{IGF,GII,TOLZ,NFRA,SPY,AGG}.json (Yahoo chart v8; IGF/GII/TOLZ/
    NFRA pulled --backfill max 2026-10-28, SPY/AGG on disk).  Total return =
    adjclose 'a'.  SPY supplies the session calendar.
universe: >-
  Fixed ETF proxies for the book's "infrastructure assets": IGF (iShares
  Global Infrastructure), GII (SPDR S&P Global Infrastructure), TOLZ (ProShares
  DJ Brookfield Global Infrastructure), NFRA (Northern Trust STOXX Global Broad
  Infrastructure).  Benchmark legs SPY / AGG.
costs: &costs >-
  Desk large-bucket floor 20 bps/side on |dW| PER LEG at each monthly rebalance
  (all legs large-ADV ETFs).  No cost between rebalances (weights held, no drift
  rebalancing).  G6 stress at 2x per-side costs (cagr reported).
gates: &gates >-
  Standard F151 daily gates per cell (sharpe sqrt(252), cagr 252/n):
  G1 lookahead - replay truncation at 4 slice cuts + loader-cap cut (weights
  through the cut identical) AND a decision-early mutant (rebalance executed one
  session EARLY, i.e. weights active from the rebalance close itself) must
  produce a different pnl series.  G2 concentration - max calendar-year share of
  net pnl <= 0.40; episode share: preregistered BY-CONSTRUCTION exemption for
  this family (every cell is always-on: exactly one episode, share 1.0 - same
  rule as the 16_2/Ch13/Ch14 static premise cells).  G3 regime - at least 2 of 3
  equal thirds of the cell's own tune window net-positive.  G4 min trades >= 24
  position-change days.  G5 fees - net Sharpe >= 0.8 AND net CAGR > 0 at base
  costs.  G6 stress - net CAGR > 0 at 2x costs.
family_decision_rule: >-
  PREMISE-CELL CLASS: every 20_1 cell is an always-on allocation, so gate
  survival alone cannot decide the book's claim.  Preregistered family decision:
  KEEP_TUNE iff AT LEAST ONE infra-sleeve cell (infra10_*/infra20_*) passes G3,
  G5 AND G6 AND has net Sharpe >= (mix_6040_base net Sharpe + 0.25) AND
  annualized vol <= 1.05 x mix_6040_base annualized vol.  Otherwise KILL.  The
  diversification PREMISE itself is adjudicated in report-only blocks (a)-(d),
  not by gates.
verdict_policy:
  - "Family decision rule above -> KILL at tune: KILL.md + REGISTRY retired, no go ask."
  - ">= 1 survivor per the rule -> KEEP_TUNE: holdout unread; BLOCKED awaiting
    standing dev go (ops/offbox/aaron_sign_dev_go.py; go file names the code
    freeze sha and max_dev_trials) before any scored DEV run."
report_only:
  - >-
    (a) Correlation matrix: monthly returns IGF/GII/TOLZ/NFRA vs SPY/AGG over
    the tune window - is the "improves risk-adjusted return via low correlation"
    premise true in-window at all?
  - >-
    (b) Stress-correlation: corr of each infra proxy vs SPY over the worst-decile
    SPY months vs all months - does infra corr RISE in equity stress?
  - >-
    (c) Sleeve economics: net Sharpe / vol / CAGR / maxDD of each infra sleeve
    cell MINUS mix_6040_base - does the sleeve improve risk-adjusted return
    after costs at 10% and 20% sizing?
  - >-
    (d) Rolling 60-session corr(IGF, SPY) and corr(IGF, AGG) path - horizon
    dependence the book's buy-and-hold framing appeals to.
data_walls: >-
  * IFRA (iShares North American Infrastructure) is in the brief's ETF list but
    its tape BEGINS 2018-04-05 (Yahoo chart v8 firstTradeDate probe 2026-10-28,
    transcript in evidence probes.txt) - NO pre-2015 tape, so it CANNOT run in
    the 2015-2017 tune window and is NOT a preregistered cell.  No post-hoc
    IFRA cell will be added.
  * The book's premise spans UNLISTED infrastructure funds (appraisal-smoothed
    private returns, Preqin/Burgiss-class); listed global-infra ETFs carry
    equity beta the private-returns diversification story partly denies - the
    standing listed-proxy limitation, preregistered (same wall as 16_2).
  * Unlisted infrastructure funds / private infra need paid deal tape ->
    F151_20_3 stub, not a proxy here.
  * Optimal allocation (the book leaves sizing to investor preferences) is NOT
    estimated: fixed 10%/20% sleeves are the preregistered sizing.
