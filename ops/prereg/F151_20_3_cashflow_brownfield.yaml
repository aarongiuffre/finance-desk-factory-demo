  * Municipal project bonds earmarked to specific infrastructure projects are
    OTC/bond-desk data (EMMA is disclosure documents, not a clean free
    project-cash-flow tape for a tradeable cross-section).
  * Listed proxies do NOT transfer the mechanism (preregistered): listed
