blocked_at_prereg: true
blocked_reason: >-
  The mechanism requires an unlisted infrastructure deal tape that no free
  source provides:
  * Brownfield-vs-greenfield selection needs project-level cash-flow data
    (contracted revenues, availability payments, concession terms, construction
    capex) - Preqin/Burgiss/EDHECinfra-class PAID private-infrastructure
    databases; no free tape exists for any jurisdiction.
