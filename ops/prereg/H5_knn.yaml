# PRE-REGISTRATION - H5_knn (PRIMARY crypto slate, book section 3.17).
# Written 2026-10-28.  NOT RUN.  New family; does not re-open any retired name.
#
# Crypto paper adaptation of Kakushadze & Serur 3.17 (Machine learning -
# single-stock KNN) applied to BTC daily.  Paper data only via ccxt; no orders,
# no credentials.  Same venue as H4: Coinbase Exchange BTC/USD daily (price +
# volume, deepest history).
#
# This prereg authorizes TUNE-window work.  The scored DEV claim additionally
# requires a committed code-freeze amendment and a standing dev go signed by
# Aaron at logs/approvals/go/H5_knn.dev.json.  No equity fold_gate read is
# requested anywhere in H5 code.
hypothesis: H5_knn
family: H5_knn
kind: hypothesis
gate_signer_fpr: "SHA256:sQtZyzHHaokOUdfOZ65gzD0eGHaj+e2qIyyPl6JKBCY"   # Aaron's signing key (must equal REGISTRY gate.signer_fpr)
literature: "Kakushadze & Serur 151 Trading Strategies section 3.17: k-NN on
  min-max normalized price/volume moving-average features predicts the next-T-day
  cumulative return; thresholds z1 (enter) and z2 (exit) turn the prediction into
  a single-stock long/short rule.  Book has NO backtests."
prior: >-
  SKEPTICAL.  Single-asset k-NN on two technical features is a weak learner and
  2015-2022 BTC is one regime; expect the val window to either churn (T=1,
  z1=0.5%) or sit flat (T=10, z1=2%), with costs eating what is left.
fold: dev
window:
  data_start: "2015-07-20"
  data_end:   "2026-10-27"
  split_rule: >-
    tape split 60/40 by bar count: tune = first 60% (through 2022-04-23),
    holdout = last 40% (NEVER read by the tune grid; scored run only).
    Inside the tune window: the KNN model is FROZEN at the val start - the
    training pool is the last train_len observations BEFORE the val start whose
    T-day label windows are complete, and the val slice is the last 40% of the
    tune bars.  No re-fitting inside the val window.

data:
  prices: data/crypto/coinbase/BTCUSD-1d.csv   # ts_utc, open, high, low, close, volume
  venue: coinbase (Coinbase Exchange spot, public ccxt OHLCV, no credentials)
  bar: UTC daily close and volume; forming bar never used

signal:
  target: "Y(s) = P(s+T)/P(s) - 1  (next-T-day cumulative return; label windows must be complete before the prediction date)"
  features: >-
    m = 6, all computed causally at day t (windows end AT t):
    X1 = MA(P,5), X2 = MA(P,20), X3 = MA(P,60), X4 = P(t)/MA(P,20),
    X5 = MA(V,5), X6 = MA(V,20).
  normalization: >-
    min-max to [0,1] using the min/max of each feature over the TRAINING POOL
    ONLY (book eq. 337).  Val values are NOT clipped - out-of-range features
    simply fall outside the unit square.
  k: "floor(sqrt(train_len))  (book: k = floor(sqrt(T*))); neighbors by Euclidean distance on the normalized features"
  prediction: "Yhat(t) = mean of the k neighbors' realized labels (book eq. 339 - the no-fit variant; the eq. 340 regression variant is NOT run)"
  rule: >-
    hysteresis thresholds per book eq. 341 with z2 = z1/2 (preregistered here;
    the book leaves z2 as an example): flat -> long when Yhat > z1, long -> flat
    when Yhat <= z2; flat -> short when Yhat < -z1, short -> flat when
    Yhat >= -z2.  Position decided at close t earns the return over [t, t+1].

variants:                                          # the WHOLE budget - no other variant may be run
  grid: "T in {1, 3, 5, 10} x z1 in {0.5%, 1%, 2%} x train_len in {365, 730} = 24 cells"
  primary: >-
    long/short book rule; the selected cell is the one with the highest
    VAL-window net Sharpe among cells passing all six gates on VAL
  secondary: >-
    long/flat at the SAME (T, z1, train_len): flat -> long when Yhat > z1,
    long -> flat when Yhat <= z2; no short leg
  selection: val-only (inside tune); ties broken by fewer trades then smaller z1

costs:
  fee_bps_per_side: 6                              # 0.06% per unit turnover, charged on each fill
  slippage_stress: "+5 bps per side on top of the 2x fee stress"
  funding: "n/a for spot daily bars; recorded as N/A, not PASS"

six_gates:                                         # adversarial KEEP/KILL, evaluated per cell on VAL
  G1_lookahead: >-
    (a) truncated-tape replay: predictions and positions through any date D in
    the val window must be identical when the tape is cut at D (5 random cuts);
    (b) label-window rule: no training observation enters the pool before its
    T-day label completes (asserted in code, tested); (c) mutation kill: a
    future-peeking mutant (features read t+1) MUST fail the replay test.
  G2_trade_concentration: "no single trade > 25% of gross PnL and no calendar year > 40% of cumulative net PnL over the val window"
  G3_single_regime: "net PnL > 0 in at least 2 of the 3 equal thirds of the val window"
  G4_min_trades: ">= 30 completed round trips on the val window (~2.7y; ~1/month floor for a daily-re-evaluated signal)"
  G5_fees: "net Sharpe >= 0.8 and net CAGR > 0 at 6 bps/side; still net CAGR > 0 at 12 bps/side"
  G6_slippage_funding: "still net CAGR > 0 at 17 bps/side; funding N/A (spot), recorded as such"

pass_bar:                                          # scored DEV, both folds reported
  tune: all six gates KEEP for the selected primary cell on VAL
  holdout: >-
    model refit at the holdout boundary the same way (pool = last train_len
    complete-label observations before the holdout start, features normalized by
    that pool), then net CAGR > 0, net Sharpe > 0, and G2/G3/G4 KEEP on holdout
  decision: >-
    pass => eligible to ASK for a validation read (Verifier + Aaron steps);
    fail => retire the H5_knn family permanently (no re-test under a new name).
    WITHOUT a standing dev go there is NO scored claim: BLOCKED, val evidence
    recorded as diagnostic-only.

metrics: >-
  CAGR, vol, Sharpe (net), gross Sharpe, max DD, hit rate, trades, avg trade
  PnL, turnover, cost drag, per-cell gate table, % of val days long/short/flat,
  B&H BTC comparison (not a gate)

reporting:
  - "headline: selected cell (T, z1, train_len), val net Sharpe, per-gate results"
  - "full 24-cell gate table (construction output, not gated)"
  - "long/flat secondary at the same cell"
  - "honest caveats: single asset; min-max normalization is sensitive to the pool bounds; k = floor(sqrt(N)) with N <= 730 means ~19-27 neighbors - high variance; val window 2019-2022 covers one bull run and the 2021-22 top, not a full regime set; G4 floor 30 is a preregistered calibration, stated ex ante"

evidence: logs/edge/H5_knn/h5_summary.json
runner: scripts/h5_run.py (grid + backtest + gates)
signal_module: scripts/h5_knn.py (features, frozen-pool KNN, hysteresis rule)
tests: scripts/h5_test.py (label-window, replay truncation, mutant kill, min-max, fee recheck)
python: /data/finance/.venv-crypto/bin/python
