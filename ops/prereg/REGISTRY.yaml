# (ssh-keygen -Y sign -n finance-go, ops/offbox/aaron_sign_dev_go.sh) or root-owned in
# /etc/finance-gate/go/.  validation/holdout: always (false refuses); dev: a STANDING go
# naming the code freeze sha + max_dev_trials.  dev stays required until Aaron decides.
