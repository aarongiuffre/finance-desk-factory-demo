# Hypothesis-family registry (fold_gate v2).  ONE holdout read per FAMILY, ever;
# validation reads are counted per family (max 3, each a strict descendant commit).
# Renaming a hypothesis does not reset anything: the family is the key.
# Adding/changing a family is a committed AND pushed change (fold_gate refuses gated
# reads while this file differs from origin/main), so it is visible to Aaron on GitHub.
# gate: (v5, Verifier round 5) a go file is required per fold before a grant: Aaron-signed
# (ssh-keygen -Y sign -n finance-go, ops/offbox/aaron_sign_dev_go.sh) or root-owned in
# /etc/finance-gate/go/.  validation/holdout: always (false refuses); dev: a STANDING go
# naming the code freeze sha + max_dev_trials.  dev stays required until Aaron decides.
gate:
  signer_fpr: "SHA256:sQtZyzHHaokOUdfOZ65gzD0eGHaj+e2qIyyPl6JKBCY"   # Aaron's ed25519 signing key, pinned 2026-10-19 via ops/staged_sudo/install_gate_key.sh
