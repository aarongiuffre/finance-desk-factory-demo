# Hypothesis-family registry (fold_gate v2).  ONE holdout read per FAMILY, ever;
# validation reads are counted per family (max 3, each a strict descendant commit).
# Renaming a hypothesis does not reset anything: the family is the key.
# Adding/changing a family is a committed AND pushed change (fold_gate refuses gated
# reads while this file differs from origin/main), so it is visible to Aaron on GitHub.
# gate: (v5, Verifier round 5) a go file is required per fold before a grant: Aaron-signed
# (ssh-keygen -Y sign -n finance-go, ops/offbox/aaron_sign_dev_go.sh) or root-owned in
# /etc/finance-gate/go/.  validation/holdout: always (false refuses); dev: a STANDING go
# naming the code freeze sha + max_dev_trials.  dev stays required until Aaron decides.
gate:
  signer_fpr: "SHA256:sQtZyzHHaokOUdfOZ65gzD0eGHaj+e2qIyyPl6JKBCY"   # Aaron's ed25519 signing key, pinned 2026-10-19 via ops/staged_sudo/install_gate_key.sh
  require_go_file:
    dev: true
    validation: true
    holdout: true
families:
  H4_inventory:
    retired: true                # failed its pre-registered PIT calibration 2026-10-18
    hypotheses: [H4_inventory_calibration_pit]
  HARNESS_NULL:
    kind: calibration            # dev-only by rule (kind != hypothesis)
    hypotheses: [HARNESS_NULL_placebo_long, HARNESS_NULL_placebo_short]
  DIAG_lang_shift:
    kind: diagnostic             # dev-only
    hypotheses: [lang_shift]
  H1_insider:
    retired: true                # failed its pre-registered dev calibration 2026-10-20 (primary alpha_t -3.47, cluster +0.29; pass bar needs >= 3; trial under freeze c86609d6)
    kind: hypothesis             # registered 2026-10-18; dev-only until Verifier + Aaron unlock
    hypotheses: [H1_opportunistic_insider_buys]
  H5_rf_change:
    retired: true                # failed its pre-registered dev calibration 2026-10-19 (primary q5_21 mean NET abn -1.05%, criterion >0; trial 1/3 under freeze f48fc705)
    kind: hypothesis             # registered 2026-10-19 (TRI-3, Aaron-approved in session); dev-only
    hypotheses: [H5_rf_change]
  H6_nasdaq_cheap:
    kind: hypothesis             # registered 2026-10-21: one-shot validation read of the S3
                                 # cheap-10 on the NASDAQ universe (dead names in) vs ONEQ;
                                 # prereg H6_nasdaq_cheap_universe.yaml, commit e9151dd data layer
    hypotheses: [H6_nasdaq_cheap_universe]
    validation_reads:
      H6_nasdaq_cheap_universe: >-
        GATED OUT 2026-10-24, Aaron's decision: the validation grant is refused
        while slowglow is root-equivalent (docker/wheel) and Aaron elected NOT
        to run ops/staged_sudo/leave_root_equivalent_groups.sh (box keeps its
        docker/sudo workflows).  The signed per-run go (nonce 3e6b7a420885002e,
        freeze 446e909a, prereg 880f93ac) is delivered and valid but unspent -
        the nonce was never granted.  The H6 validation question stays OPEN and
        honestly labeled: no counted validation read exists for the NASDAQ
        cheap-10 sleeve vs ONEQ; no re-test under a new name unless Aaron
        explicitly re-opens the family.  Note: an unauthorized root-owned go
        file for this hypothesis appeared in /etc/finance-gate/go/ on 2026-10-21
        (moved aside as .revoked-20261024 by Aaron - an on-box root go cannot
